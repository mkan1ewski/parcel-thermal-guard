version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thermal_backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend/thermal_guard
      dockerfile: Dockerfile
    container_name: thermal_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend